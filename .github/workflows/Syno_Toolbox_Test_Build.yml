name: TEST Build Syno Toolbox Test Package

on:
  workflow_dispatch:
    inputs:
      test_tag:
        # Set zip file name 
        description: 'Version for this test build (also used to name the downloadable artifact zip - never published)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-spk:
    name: Build Test Package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ['kvmx64', 'rtd1296']
        dsm: ['7.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get test tag
        id: get_tag
        run: |
          test_tag="${{ github.event.inputs.test_tag }}"
          if [ -z "$test_tag" ]; then
            test_tag="test-${{ github.run_number }}"
          fi
          echo "new_tag=$test_tag" >> $GITHUB_OUTPUT

      - name: Determine DSM suffix
        id: dsm_suffix
        run: |
          # Count how many DSM versions are in the matrix
          dsm_list='${{ toJSON(matrix.dsm) }}'
          count=$(echo "$dsm_list" | jq 'if type == "array" then length else 1 end')
          current="${{ matrix.dsm }}"
          if [ "$count" -eq 1 ] && [ "$current" = "7.0" ]; then
            echo "suffix=DSM-7.x" >> $GITHUB_OUTPUT
          else
            echo "suffix=DSM-${current}" >> $GITHUB_OUTPUT
          fi

      # Synology's own platform codes (kvmx64, rtd1296, ...) aren't
      # meaningful to someone picking a download - map to the arch
      # label people actually recognize.
      - name: Map arch to display label
        id: arch_label
        run: |
          case "${{ matrix.arch }}" in
            kvmx64) label="x86_64" ;;
            rtd1296) label="aarch64" ;;
            *) echo "::error::No display label mapped for arch '${{ matrix.arch }}'"; exit 1 ;;
          esac
          echo "label=$label" >> $GITHUB_OUTPUT

      - name: Synology Package Builder Github Action
        uses: 007revad/synology-package-builder@main
        with:
          dsm: ${{ matrix.dsm }}
          arch: ${{ matrix.arch }}
          output: ./dist

      - name: Remove debug spk and rename package
        run: |
          ls -l ./dist
          rm ./dist/*_debug.spk
          for f in ./dist/*.spk; do
            mv "$f" "./dist/Syno_Toolbox-${{ steps.arch_label.outputs.label }}-${{ steps.get_tag.outputs.new_tag }}-${{ steps.dsm_suffix.outputs.suffix }}.spk"
          done
          ls -l ./dist

      # Only needs to happen once - the noarch/DSM6 output doesn't
      # depend on which arch built it, and running it per matrix leg
      # would just produce duplicate, colliding artifacts.
      - name: Create noarch package
        if: matrix.arch == 'kvmx64'
        run: |
          for f in ./dist/Syno_Toolbox-${{ steps.arch_label.outputs.label }}-*.spk; do
            noarch="${f/${{ steps.arch_label.outputs.label }}/noarch}"
            tmpdir=$(mktemp -d)
            tar -xf "$f" -C "$tmpdir"
            sed -i 's/arch=".*"/arch="noarch"/' "$tmpdir/INFO"
            tar -cf "$noarch" -C "$tmpdir" $(ls "$tmpdir")
            rm -rf "$tmpdir"
          done
          ls -l ./dist

      - name: Create DSM 6 package
        if: matrix.arch == 'kvmx64'
        run: |
          for f in ./dist/Syno_Toolbox-noarch-*.spk; do
            dsm6="${f/${{ steps.dsm_suffix.outputs.suffix }}/DSM-6.x}"
            tmpdir=$(mktemp -d)
            tar -xf "$f" -C "$tmpdir"
            rm -rf "$tmpdir/WIZARD_UIFILES"
            rm -rf "$tmpdir/conf"
            rm -rf "$tmpdir/helper"
            sed -i -E 's/os_min_ver="7\.0-[0-9]+"/os_min_ver="6.0-7321"/' "$tmpdir/INFO"
            sed -i 's/os_max_ver="9.9-99999"/os_max_ver="6.9-99999"/' "$tmpdir/INFO"
            tar -cf "$dsm6" -C "$tmpdir" $(ls "$tmpdir")
            rm -rf "$tmpdir"
          done
          ls -l ./dist

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Syno_Toolbox-${{ steps.arch_label.outputs.label }}-${{ steps.dsm_suffix.outputs.suffix }}-${{ steps.get_tag.outputs.new_tag }}
          path: ./dist/*.spk
